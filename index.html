<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web GIS SMP Metro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100%;
}

/* Topbar */
.topbar {
    background: #3498db;
    color: white;
    padding: 10px 20px;
    text-align: center;
}

/* Navbar */
.navbar {
    background: #2980b9;
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 0;
    padding: 10px 0;
}
.navbar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 8px 15px;
    border-radius: 5px;
}
.navbar a:hover { background: #1f5f8b; }

/* Hero Section */
.hero {
    position: relative;
    height: 80vh;
    text-align: left;
    padding: 60px 40px;
    color: #1a5276;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
}

/* Hero text di atas peta */
.hero-content {
    position: relative;
    z-index: 2;
}
.hero h1 { font-size: 48px; margin-bottom: 10px; }
.hero h3 { font-size: 28px; margin-bottom: 20px; }
.hero p  { font-size: 18px; max-width: 600px; line-height: 1.5; }

/* Overlay putih tipis */
.hero-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.55);
    z-index: 1;
    pointer-events: none;
}

/* Peta background */
#hero-map {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
    📞 087875760486 &nbsp;&nbsp; ✉ mutiaramarta18@gmail.com
</div>

<!-- Navbar -->
<div class="navbar">
    <a href="index.html">Home</a>
    <a href="Pages/Biodata.html">Biodata</a>
    <a href="Pages/WebGis.html">Peta</a>
</div>

<!-- Hero Section -->
<section class="hero">
    <div id="hero-map"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1>Web GIS</h1>
        <h3>Pemetaan Interaktif</h3>
        <p>Sistem Informasi Geografis untuk visualisasi data spasial secara interaktif dan informatif. Lihat persebaran sekolah dan data lokasi di Kota Metro dengan mudah dan jelas.</p>
    </div>
</section>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
var mapHero = L.map('hero-map', {
    zoomControl: false,
    attributionControl: false,
    dragging: false,
    scrollWheelZoom: false
}).setView([-5.12, 105.30], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapHero);
</script>

</body>
</html>
